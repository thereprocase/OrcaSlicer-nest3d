# Probes whether a GitHub-hosted macOS runner has a usable GUI session: a WindowServer, screen
# capture and System Events keystrokes into a focused text field. Runs only on pushes to this branch.
name: macOS GUI diagnostic

on:
  push:
    branches: [ci/mac-gui-diagnostic]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Session and display
        run: |
          sw_vers
          uname -m
          id
          launchctl print "gui/$(id -u)" | head -20 || echo "NO_GUI_DOMAIN"
          pgrep -lf WindowServer || echo "NO_WINDOWSERVER"
          system_profiler SPDisplaysDataType | head -30 || true

      - name: Screen capture
        run: |
          screencapture -x desktop.png
          ls -l desktop.png

      - name: Keystrokes into a focused text field
        run: |
          open -a TextEdit
          sleep 5
          osascript -e 'tell application "TextEdit" to activate' -e 'tell application "TextEdit" to make new document'
          sleep 2
          if osascript -e 'tell application "System Events" to keystroke "typed by System Events"'; then
            echo "KEYSTROKE_SENT"
          else
            echo "KEYSTROKE_REFUSED"
          fi
          sleep 1
          osascript -e 'tell application "TextEdit" to get text of front document' || echo "READBACK_FAILED"
          osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true' || true
          screencapture -x textedit.png

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-gui-probe-${{ matrix.os }}
          path: '*.png'
          if-no-files-found: warn
