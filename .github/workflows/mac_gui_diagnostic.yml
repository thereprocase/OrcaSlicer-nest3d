# Probes whether a GitHub-hosted macOS runner has a usable GUI session: a WindowServer, screen
# capture and System Events keystrokes into a focused text field. Runs only on pushes to this branch.
name: macOS GUI diagnostic

on:
  push:
    branches: [ci/mac-gui-diagnostic]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Session and display
        run: |
          sw_vers
          uname -m
          id
          launchctl print "gui/$(id -u)" | head -20 || echo "NO_GUI_DOMAIN"
          pgrep -lf WindowServer || echo "NO_WINDOWSERVER"
          system_profiler SPDisplaysDataType | head -30 || true

      - name: Screen capture
        run: |
          screencapture -x desktop.png
          ls -l desktop.png

      - name: Privacy grants (TCC)
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServiceAppleEvents','kTCCServicePostEvent','kTCCServiceScreenCapture') order by service;" || true
          done

      # No AppleEvents to TextEdit: opening a file needs no automation consent, so a hang here
      # cannot be a consent prompt. Each event source gets its own short timeout.
      - name: Keystrokes into a focused text field
        run: |
          printf '' > "$PWD/probe.txt"
          open -a TextEdit "$PWD/probe.txt"
          sleep 6
          screencapture -x 1-textedit-open.png
          if timeout 30 osascript -e 'tell application "System Events" to keystroke "typed by System Events"'; then
            echo "SYSTEM_EVENTS_KEYSTROKE_SENT"
          else
            echo "SYSTEM_EVENTS_KEYSTROKE_FAILED rc=$?"
          fi
          sleep 1
          screencapture -x 2-after-system-events.png
          brew install cliclick >/dev/null 2>&1 || echo "CLICLICK_INSTALL_FAILED"
          if timeout 30 cliclick t:" typed by cliclick"; then
            echo "CLICLICK_KEYSTROKE_SENT"
          else
            echo "CLICLICK_KEYSTROKE_FAILED rc=$?"
          fi
          sleep 1
          screencapture -x 3-after-cliclick.png

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-gui-probe-${{ matrix.os }}
          path: '*.png'
          if-no-files-found: warn
