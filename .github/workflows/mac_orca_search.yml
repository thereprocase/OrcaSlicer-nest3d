# Launches the PR's macOS arm64 app bundle on a hosted runner with an isolated data directory,
# drives the sidebar filament combo with cliclick and uploads a screenshot after every step.
# Runs only on pushes to this branch; the bundle comes from the fork's build run.
name: macOS Orca filament search

on:
  push:
    branches: [ci/mac-gui-diagnostic]

permissions:
  contents: read
  actions: read

env:
  BUILD_RUN_ID: "39463011863"
  HEAD_SHA: 16f49782c9f7facacd14d88369022f57fff54395
  # Screen points on the 1920x1080 runner display, read off the previous run's captures.
  PREPARE_X: "481"
  PREPARE_Y: "130"
  CALIBRATION_X: "1025"
  CALIBRATION_Y: "130"
  COMBO_X: ""
  COMBO_Y: ""

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64, route: prepare, source: pr }
          # Control: upstream's released app on the same runner, to separate runner
          # behaviour from the PR's.
          - { runner: macos-14, arch: arm64-release-2.4.2, route: prepare, source: release }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Download app bundle
        if: matrix.source == 'pr'
        uses: actions/download-artifact@v7
        with:
          name: OrcaSlicer_Mac_bundle_arm64_${{ env.HEAD_SHA }}
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: bundle

      - name: Download upstream release
        if: matrix.source == 'release'
        run: |
          curl -fsSL -o orca.dmg https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Mac_universal_V2.4.2.dmg
          shasum -a 256 orca.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/orca orca.dmg
          mkdir -p app && cp -R /Volumes/orca/OrcaSlicer.app app/
          hdiutil detach /Volumes/orca

      - name: Unpack
        run: |
          mkdir -p app
          if [ -d bundle ]; then tar -xzf bundle/*.tar.gz -C app; fi
          APP=$(find app -maxdepth 3 -name 'OrcaSlicer.app' -type d | head -1)
          test -n "$APP" || { echo 'OrcaSlicer.app not found'; find app -maxdepth 3; exit 1; }
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          xattr -cr "$APP"
          ls "$APP/Contents/MacOS"

      # Skips the setup wizard with stock P1S presets; no account, no network features.
      - name: Isolated data directory
        run: |
          mkdir -p "$HOME/orca-test"
          cat > "$HOME/orca-test/OrcaSlicer.conf" <<'EOF'
          {
              "app": {
                  "dark_color_mode": "0",
                  "enable_ota": false,
                  "language": "en_US",
                  "preset_bundle_auto_update": false,
                  "region": "North America",
                  "show_daily_tips": false,
                  "show_splash_screen": false,
                  "stealth_mode": true,
                  "user_mode": "simple"
              },
              "filaments": [
                  "Bambu PLA Basic @BBL P1S 0.4 nozzle",
                  "Bambu PLA Matte @BBL P1S 0.4 nozzle",
                  "Bambu PETG HF @BBL P1S 0.4 nozzle",
                  "Generic PETG",
                  "Generic PETG HF @BBL P1S 0.4 nozzle",
                  "Generic PLA",
                  "Generic PLA Silk",
                  "Elegoo PLA Matte @System",
                  "PolyLite PLA @System"
              ],
              "firstguide": { "finish": true },
              "models": [ { "model": "Bambu Lab P1S", "nozzle_diameter": "0.4", "vendor": "BBL" } ],
              "presets": { "machine": "Bambu Lab P1S 0.4 nozzle" }
          }
          EOF

      - name: Install cliclick
        run: brew install cliclick

      - name: Launch
        run: |
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          echo "Launching $APP/Contents/MacOS/$BIN"
          "$APP/Contents/MacOS/$BIN" --datadir "$HOME/orca-test" > orca-stdout.log 2>&1 &
          echo $! > orca.pid
          sleep 60
          screencapture -x 01-launched.png
          # Dismiss any startup dialog, then capture again.
          cliclick kp:esc
          sleep 3
          screencapture -x 02-after-esc.png
          system_profiler SPDisplaysDataType | grep -i -E 'resolution|metal|chipset' || true
          # A GPU-less GL deadlock leaves the main thread parked; a stack sample shows it.
          sample "$(cat orca.pid)" 3 -file orca-sample.txt >/dev/null 2>&1 || true

      # Loading the 3D scene is where a GPU-less macOS VM deadlocks, so sample here too.
      # The Calibration tab has a search-enabled filament combo and no 3D scene.
      - name: Open the Calibration tab
        if: matrix.route == 'calibration'
        run: |
          # The modal update-check dialog arrives late and swallows clicks: wait for it and
          # press its Cancel button first. Without the dialog that point is empty page.
          sleep 20
          screencapture -x 04-before-calibration.png
          cliclick c:1229,755
          sleep 3
          cliclick c:"$CALIBRATION_X","$CALIBRATION_Y"
          sleep 15
          screencapture -x 05-calibration.png
          sample "$(cat orca.pid)" 3 -file orca-sample-calibration.txt >/dev/null 2>&1 || true

      - name: Open the Prepare tab
        if: matrix.route == 'prepare'
        run: |
          sleep 20
          screencapture -x 03-before-prepare.png
          cliclick c:1229,755
          sleep 3
          cliclick c:"$PREPARE_X","$PREPARE_Y"
          sleep 20
          screencapture -x 03-prepare.png
          sample "$(cat orca.pid)" 3 -file orca-sample-prepare.txt >/dev/null 2>&1 || true

      - name: Drive the filament combo
        if: env.COMBO_X != ''
        run: |
          shot() { sleep 2; screencapture -x "$1"; }
          cliclick c:"$COMBO_X","$COMBO_Y"; shot 10-open.png
          cliclick t:"pla"; shot 11-pla.png
          cliclick kp:esc; sleep 1; cliclick c:"$COMBO_X","$COMBO_Y"; sleep 1
          cliclick t:"generic petg"; shot 12-generic-petg.png
          cliclick kp:arrow-down; shot 13-down.png
          cliclick kp:return; shot 14-enter.png
          cliclick c:"$COMBO_X","$COMBO_Y"; sleep 1
          cliclick t:"zzqx"; shot 15-no-match.png
          cliclick kp:esc; shot 16-esc.png

      - name: Upload captures and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-orca-search-${{ matrix.arch }}
          path: |
            *.png
            orca-stdout.log
            orca-sample*.txt
          if-no-files-found: warn
